<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Quetzal AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="error-body">

  <div class="error-container">
    <div class="error-logo">
      <img src="img/logo.png" alt="Quetzal AI" />
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Esta página se fue volando</h1>
    <p class="error-message">
      Parece que el quetzal se llevó la página que buscabas.<br>
      Verificá que la URL sea correcta o volvé al inicio.
    </p>

    <div class="error-actions">
      <a href="index.html" class="btn-primary-lg">🏠 Ir al inicio</a>
      <a href="login.html" class="btn-secondary-lg">Iniciar sesión</a>
    </div>

    <div class="error-help">
      <p>Si llegaste acá desde un link compartido, verificá que esté completo.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
